version: '3.7'

services:
  db:
    container_name: mysql-db
    image: mysql:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: schovela
      MYSQL_USER: samson
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306" 
    volumes:
      - ./data:/var/lib/mysql
